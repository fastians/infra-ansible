# Mek-Lab app hosts — three tiers (use --limit to target one tier)
#
# 1. GCP legacy     — backend-server, salome-server
# 2. AWS staging    — backend-aws-staging, salome-aws-staging (all-in-one API host)
# 3. AWS production — split or all-in-one:
#      all-in-one: backend-aws-prod runs backend + geo + llm (nginx → localhost)
#      split:      backend-aws-prod + geo-aws-prod + llm-aws-prod + salome-aws-prod
#                  (nginx on api host proxies /geo/ and /llm/ to private VPC IPs)

# --- 1. GCP (kept) ---
[backend_legacy]
backend-server ansible_host=34.47.101.190 ansible_user=mateen_fastians

[salome_legacy]
salome-server ansible_host=34.47.115.135 ansible_user=mateen_fastians

# --- 2. AWS staging (all-in-one API: backend + geo + llm on one VM) ---
# IPs are ephemeral (no Elastic IP attached) — re-verify with `aws ec2
# describe-instances` after any stop/start, they will change.
# SSH key migrated 2026-07-03: only id_ed25519_company_servers is in
# authorized_keys on these two hosts now (old mek-lab-yoo key removed).
[backend_staging]
backend-aws-staging ansible_host=52.79.52.63 ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/id_ed25519_company_servers

[salome_staging]
salome-aws-staging ansible_host=3.36.69.92 ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/id_ed25519_company_servers

# --- 3. AWS production ---
[backend_production]
backend-aws-prod ansible_host=15.164.227.138 ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/id_ed25519_company_servers

# Dedicated GEO/LLM hosts — uncomment after Terraform apply (enable_split_microservices = true)
[geo_production]
geo-aws-prod ansible_host=3.34.141.166 ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/id_ed25519_company_servers

[llm_production]
llm-aws-prod ansible_host=3.38.193.243 ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/id_ed25519_company_servers

[salome_production]
# Instance was stopped as of 2026-07-03; restarted during this review, new
# ephemeral public IP (no Elastic IP attached — will change again on next stop/start).
salome-aws-prod ansible_host=15.165.75.87 ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/id_ed25519_company_servers

# Dedicated GPU (CUDA) host for CAD_generation / FlexCAD.
# Uncomment and set ansible_host after Terraform apply with enable_cadllm = true
# (use the `cadllm_public_ip` output). Launched from the AWS Deep Learning GPU AMI,
# so ansible_user is ubuntu. Keep it stopped when idle to control GPU cost.
[cadllm_production]
cadllm-aws-prod ansible_host=43.203.228.64 ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/id_ed25519_company_servers

[backend:children]
backend_staging
backend_production

[geo:children]
geo_production

[llm:children]
llm_production

[cadllm:children]
cadllm_production

[salome:children]
salome_staging
salome_production

[monitoring]
monitoring-server
